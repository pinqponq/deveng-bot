name: Bug report
description: Report a bug in Deveng Bot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **Deveng Bot**.
        Do **not** paste tokens, secrets, or full `.env` contents.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Bot
        - Web panel / BFF
        - API
        - Worker
        - Docker / Compose
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, commit SHA, or "main @ &lt;date&gt;"
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, Docker vs local, Node/.NET versions (no secrets)
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact tokens and passwords before pasting.
